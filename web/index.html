<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Demonstração de salvamentos, localização e classificação interativa.">
    <title>Cyber Kitty Adventures — Demonstração técnica</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
</head>
<body>
    <div class="shell">
        <header class="masthead">
            <a href="./" class="brand">
                <span class="brand-symbol" aria-hidden="true">▦</span>
                <span><small data-copy="identity"></small><strong data-copy="product"></strong></span>
            </a>
            <label class="locale"><span data-copy="select"></span>
                <select id="locale"><option value="pt-BR" lang="pt-BR">Português (BR)</option><option value="en" lang="en">English</option></select>
            </label>
        </header>
        <main>
            <section class="hero" aria-labelledby="title">
                <div class="hero-copy">
                    <h1 id="title" data-copy="title"></h1>
                    <p data-copy="intro"></p>
                </div>
                <div class="hero-art" aria-hidden="true">
                    <span class="orbit orbit-one"></span><span class="orbit orbit-two"></span>
                    <span class="art-card art-back"><i></i><i></i></span>
                    <span class="art-card art-front"><span class="art-mark">✓</span><i></i><i></i><i></i></span>
                    <span class="spark spark-one">✦</span><span class="spark spark-two">✧</span>
                </div>
            </section>
            <div class="workbench">
                <aside class="sidebar" aria-labelledby="slots-title">
                    <h2 id="slots-title" data-copy="slots"></h2>
                    <nav id="slots" aria-labelledby="slots-title"></nav>
                    <p data-copy="demoData" class="quiet"></p>
                </aside>
                <section id="work" class="work" aria-label="Área de trabalho"></section>
            </div>
            <p class="quiet footer" data-copy="note"></p>
        </main>
    </div>
    <template id="record-template"><button type="button" class="record"><span class="file-icon" aria-hidden="true"></span><span><strong></strong><small></small></span></button></template>
    <dialog id="confirmation" aria-labelledby="dialog-title" aria-describedby="dialog-note">
        <form id="confirmation-form">
            <h2 id="dialog-title"></h2>
            <p id="dialog-note"></p>
            <label id="name-field"><span data-copy="profile"></span><input id="profile-input" name="profile" maxlength="24" autocomplete="off" spellcheck="false"></label>
            <p id="dialog-error" role="alert"></p>
            <div class="actions">
                <button id="cancel" type="button" class="secondary" data-copy="cancel"></button>
                <button id="confirm" type="submit" class="primary"></button>
            </div>
        </form>
    </dialog>
    <noscript>Ative JavaScript para usar a demonstração. / Enable JavaScript to use the showcase.</noscript>
</body>
</html>
